spring:
  application:
    name: config-server

  cloud:
    config:
      server:
        git:
          uri: https://github.com/luvanidixit101/toolshare-microservices.git
          default-label: main
          clone-on-start: true

management:
  endpoints:
    web:
      exposure:
        include: "*"