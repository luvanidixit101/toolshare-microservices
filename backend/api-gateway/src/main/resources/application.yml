server:
  port: 8080

spring:
  application:
    name: api-gateway

  config:
    import: optional:configserver:http://localhost:8888

  cloud:
    gateway:
      mvc:
        routes:
          - id: auth-service
            uri: lb://AUTH-SERVICE
            predicates:
              - Path=/api/auth/**
          - id: user-service
            uri: lb://USER-SERVICE
            predicates:
              - Path=/api/users/**
          - id: tool-service
            uri: lb://TOOL-SERVICE
            predicates:
              - Path=/api/tools/**
          - id: booking-service
            uri: lb://BOOKING-SERVICE
            predicates:
              - Path=/api/bookings/**
          - id: review-service
            uri: lb://REVIEW-SERVICE
            predicates:
              - Path=/api/reviews/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info