server:
  port: 8085

spring:
  application:
    name: chat-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:${POSTGRES_HOST:localhost}}:${DB_PORT:${POSTGRES_PORT:5432}}/${CHAT_DB_NAME:toolshare_chat}
    username: ${DB_USERNAME:${POSTGRES_USER:admin}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:admin}}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    default-property-inclusion: non_null

toolshare:
  security:
    jwt-secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.toolshare.chat: INFO

