server:
  port: 8086

spring:
  application:
    name: ai-service

  datasource:
    url: jdbc:postgresql://localhost:5432/toolshare_ai
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

ai:
  gemini:
    api-key: ${GEMINI_API_KEY}
    model: gemini-2.5-flash

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.toolshare.ai: INFO