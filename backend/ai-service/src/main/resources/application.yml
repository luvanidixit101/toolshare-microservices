server:
  port: 8086

spring:
  application:
    name: ai-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:${POSTGRES_HOST:localhost}}:${DB_PORT:${POSTGRES_PORT:5432}}/${AI_DB_NAME:toolshare_ai}
    username: ${DB_USERNAME:${POSTGRES_USER:admin}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:admin}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

ai:
  gemini:
    api-key: ${GEMINI_API_KEY}
    model: gemini-2.5-flash

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.toolshare.ai: INFO