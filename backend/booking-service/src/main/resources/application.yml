server:
  port: 8084

spring:
  application:
    name: booking-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:${POSTGRES_HOST:localhost}}:${DB_PORT:${POSTGRES_PORT:5432}}/${BOOKING_DB_NAME:toolshare_booking}
    username: ${DB_USERNAME:${POSTGRES_USER:admin}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:admin}}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  jackson:
    default-property-inclusion: non_null

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

toolshare:
  security:
    jwt-secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
  services:
    tool-url: ${TOOL_SERVICE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.toolshare.booking: INFO
